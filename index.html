<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ジングルボード</title>
<style>
  :root{
    --bg:#f4f6f8; --card:#ffffff; --text:#1a1d21; --sub:#6b7280;
    --accent:#1596C7; --accent-dark:#0f7699; --border:#e2e6ea;
    --danger:#e0554f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171a; --card:#1f2428; --text:#f0f2f4; --sub:#9aa3ab;
      --accent:#3db8e8; --accent-dark:#1596C7; --border:#31373d;
      --danger:#ff756e;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171a; --card:#1f2428; --text:#f0f2f4; --sub:#9aa3ab;
    --accent:#3db8e8; --accent-dark:#1596C7; --border:#31373d;
    --danger:#ff756e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{overscroll-behavior-y:none;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    padding:16px; padding-bottom:40px; min-height:100vh;
  }
  h1{font-size:1.15rem; margin:0 0 4px;}
  p.desc{color:var(--sub); margin:0 0 16px; font-size:0.8rem;}
  .toolbar{
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;
    position:sticky; top:0; background:var(--bg); z-index:10; padding:4px 0;
  }
  button.main-btn{
    background:var(--accent); color:#fff; border:none; border-radius:10px;
    padding:12px 16px; font-size:0.85rem; cursor:pointer; font-weight:600;
    flex:1; min-width:120px; min-height:44px;
  }
  button.main-btn.stop{background:var(--danger);}
  button.main-btn:active{background:var(--accent-dark); transform:scale(0.98);}
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:12px;
  }
  @media (max-width:480px){
    .grid{grid-template-columns:repeat(2,1fr); gap:10px;}
    body{padding:12px; padding-bottom:40px;}
  }
  .pad{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px 10px; display:flex; flex-direction:column; align-items:center;
    gap:6px; cursor:pointer; transition:transform .08s, box-shadow .15s;
    user-select:none; position:relative; min-height:120px; justify-content:center;
    touch-action:manipulation;
  }
  .pad:active{transform:scale(0.96);}
  .pad.playing{box-shadow:0 0 0 3px var(--accent);}
  .pad .icon{font-size:1.7rem;}
  .pad .label{font-weight:600; font-size:0.9rem; text-align:center; word-break:break-word; line-height:1.3;}
  .pad .empty-hint{font-size:0.68rem; color:var(--sub);}
  .pad .controls{display:flex; gap:4px; flex-wrap:wrap; justify-content:center; margin-top:4px;}
  .pad .assign-btn{
    font-size:0.68rem; color:var(--accent); background:none; border:none;
    cursor:pointer; padding:4px 6px; min-height:28px;
  }
  .pad input[type=file]{display:none;}
  footer{color:var(--sub); font-size:0.72rem; margin-top:20px; line-height:1.6;}
  .status{font-size:0.72rem; color:var(--sub); margin-bottom:10px; min-height:1em;}
</style>
</head>
<body>

<h1>🎵 ジングルボード</h1>
<p class="desc">ボタンに好きな音声ファイルを割り当てて、タップで再生できます。設定は端末に保存され、リロードしても消えません。</p>

<div class="toolbar">
  <button class="main-btn" id="addPadBtn">＋ パッドを追加</button>
  <button class="main-btn stop" id="stopAllBtn">■ 全停止</button>
</div>
<div class="status" id="status"></div>

<div class="grid" id="grid"></div>

<footer>
  著作権保護された楽曲データそのものはこのアプリに含まれていません。お手持ちの音源ファイルをボタンに割り当ててご利用ください。<br>
  割り当てた音源はこの端末のブラウザ内（IndexedDB）にのみ保存され、他の人とは共有されません。
</footer>

<script>
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const DB_NAME = 'jingleboard_db';
const STORE_NAME = 'pads';
let db = null;

function showStatus(msg, isError){
  statusEl.textContent = msg;
  statusEl.style.color = isError ? 'var(--danger)' : 'var(--sub)';
  if (!isError) {
    setTimeout(()=>{ if (statusEl.textContent === msg) statusEl.textContent=''; }, 2500);
  }
}

function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE_NAME)) {
        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = (e) => resolve(e.target.result);
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbGetAll(){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = (e) => reject(e.target.error);
  });
}

function dbPut(pad){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(pad);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

function dbDelete(id){
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e.target.error);
  });
}

function cryptoId(){
  return 'p_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}

let pads = [];
let objectUrls = {};
let currentAudio = null;
let currentPlayingPadId = null;

async function init(){
  try {
    db = await openDB();
    pads = await dbGetAll();
  } catch(e) {
    showStatus('保存領域の初期化に失敗しました。ブラウザのプライベートモードでは保存できない場合があります。', true);
    pads = [];
  }

  if (pads.length === 0) {
    pads = [
      { id: cryptoId(), label: 'マンボNo.5', audioBlob: null, labelSetByUser: true },
      { id: cryptoId(), label: '正解音', audioBlob: null, labelSetByUser: true },
      { id: cryptoId(), label: 'ブブー', audioBlob: null, labelSetByUser: true },
      { id: cryptoId(), label: 'ドラムロール', audioBlob: null, labelSetByUser: true },
    ];
    for (const p of pads) {
      try { await dbPut(p); } catch(e){}
    }
  }
  render();
}

function stopAll(){
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  currentPlayingPadId = null;
  render();
}

function getObjectUrl(pad){
  if (!pad.audioBlob) return null;
  if (!objectUrls[pad.id]) {
    objectUrls[pad.id] = URL.createObjectURL(pad.audioBlob);
  }
  return objectUrls[pad.id];
}

function playPad(pad){
  const url = getObjectUrl(pad);
  if (!url) return;
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  const audio = new Audio(url);
  currentAudio = audio;
  currentPlayingPadId = pad.id;
  audio.play().catch(()=>{ showStatus('再生に失敗しました', true); });
  audio.onended = () => {
    if (currentPlayingPadId === pad.id) {
      currentPlayingPadId = null;
      render();
    }
  };
  render();
}

async function handleFile(pad, file){
  pad.audioBlob = file;
  if (!pad.labelSetByUser) {
    pad.label = file.name.replace(/\.[^/.]+$/, '');
  }
  delete objectUrls[pad.id];
  try {
    await dbPut(pad);
    showStatus('保存しました');
  } catch(e) {
    showStatus('保存に失敗しました: ' + (e && e.message ? e.message : e), true);
  }
  render();
}

async function renamePad(pad){
  const name = prompt('ボタン名を入力してください', pad.label || '');
  if (name !== null && name.trim() !== '') {
    pad.label = name.trim();
    pad.labelSetByUser = true;
    try { await dbPut(pad); showStatus('保存しました'); }
    catch(e) { showStatus('保存に失敗しました', true); }
    render();
  }
}

async function deletePad(pad){
  if (!confirm(`「${pad.label}」を削除しますか？`)) return;
  pads = pads.filter(p => p.id !== pad.id);
  if (objectUrls[pad.id]) { URL.revokeObjectURL(objectUrls[pad.id]); delete objectUrls[pad.id]; }
  try { await dbDelete(pad.id); } catch(e){}
  render();
}

function render(){
  grid.innerHTML = '';
  pads.forEach(pad => {
    const el = document.createElement('div');
    el.className = 'pad' + (currentPlayingPadId === pad.id ? ' playing' : '');

    const icon = document.createElement('div');
    icon.className = 'icon';
    icon.textContent = pad.audioBlob ? (currentPlayingPadId === pad.id ? '⏸️' : '▶️') : '📥';
    el.appendChild(icon);

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = pad.label || '（無題）';
    el.appendChild(label);

    if (!pad.audioBlob) {
      const hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'タップして音源を選択';
      el.appendChild(hint);
    }

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'audio/*,.mp3,.wav,.m4a,.aac,.ogg';
    fileInput.onchange = (e) => {
      if (e.target.files[0]) handleFile(pad, e.target.files[0]);
    };
    el.appendChild(fileInput);

    el.onclick = () => {
      if (pad.audioBlob) {
        if (currentPlayingPadId === pad.id) {
          stopAll();
        } else {
          playPad(pad);
        }
      } else {
        fileInput.click();
      }
    };

    const controls = document.createElement('div');
    controls.className = 'controls';

    const renameBtn = document.createElement('button');
    renameBtn.className = 'assign-btn';
    renameBtn.textContent = '名前変更';
    renameBtn.onclick = (e) => { e.stopPropagation(); renamePad(pad); };
    controls.appendChild(renameBtn);

    const changeBtn = document.createElement('button');
    changeBtn.className = 'assign-btn';
    changeBtn.textContent = pad.audioBlob ? '音源変更' : '音源選択';
    changeBtn.onclick = (e) => { e.stopPropagation(); fileInput.click(); };
    controls.appendChild(changeBtn);

    const delBtn = document.createElement('button');
    delBtn.className = 'assign-btn';
    delBtn.textContent = '削除';
    delBtn.style.color = 'var(--danger)';
    delBtn.onclick = (e) => { e.stopPropagation(); deletePad(pad); };
    controls.appendChild(delBtn);

    el.appendChild(controls);
    grid.appendChild(el);
  });
}

document.getElementById('addPadBtn').onclick = async () => {
  const pad = { id: cryptoId(), label: '新しいジングル', audioBlob: null, labelSetByUser: false };
  pads.push(pad);
  try { await dbPut(pad); } catch(e){}
  render();
};

document.getElementById('stopAllBtn').onclick = stopAll;

init();
</script>

</body>
</html>
